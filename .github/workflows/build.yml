name: Build debug APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Stamp the build with its commit (shown in Settings > About)
        run: echo "$GITHUB_SHA" > app/src/main/assets/build_id.txt

      # Opens the real Settings screen and every page, so a crash on opening fails here and not on the phone.
      - name: Settings smoke test
        run: gradle testDebugUnitTest -PsmokeOnly --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SakuriKey-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # A rolling pre-release called "latest" holds the newest APK as a plain, unzipped file.
      # Pre-releases are skipped by the in-app update check, so this never looks like a version.
      - name: Update the rolling "latest" release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SakuriKey-latest.apk
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest SakuriKey-latest.apk --prerelease \
            --target "$GITHUB_SHA" --title "Latest test build" \
            --notes "Newest build from branch ${GITHUB_REF_NAME}, commit ${GITHUB_SHA::7}. Not a versioned release."

      - name: Lint (report only, for Android version problems)
        continue-on-error: true
        run: |
          gradle lintDebug --stacktrace || true
          echo "=== Lint results (errors and warnings about newer-Android calls first) ==="
          if [ -f app/build/reports/lint-results.txt ]; then
            grep -E "NewApi|InlinedApi|Overdraw|MissingPermission|UnprotectedSMSBroadcastReceiver|ExportedService|Recycle|ClickableViewAccessibility" -B1 -A3 app/build/reports/lint-results.txt | head -200 || true
            tail -5 app/build/reports/lint-results.txt
          fi

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            **/build/reports
            **/build/test-results
