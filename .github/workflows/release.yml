name: Release

# Publishes a signed APK as a GitHub Release when you push a version tag, e.g.:
#   git tag v1.0.0 && git push origin v1.0.0
# Needs these repository secrets (see README, "Making a signed release"):
#   RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "The RELEASE_KEYSTORE_BASE64 secret is missing. See the README." >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build the release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle assembleRelease -PappVersionName="${GITHUB_REF_NAME#v}" -PappVersionCode="${{ github.run_number }}" --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk "SakuriKey-${GITHUB_REF_NAME}.apk"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: SakuriKey-*.apk
          generate_release_notes: true
