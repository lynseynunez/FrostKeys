name: Release

# Publishes an APK as a GitHub Release. Start it any of these ways:
#   - change the version in release-version.txt and push (works from any branch)
#   - in the Actions tab: Release > Run workflow, and type a version such as 1.0.0
#   - or push a version tag: git tag v1.0.0 && git push origin v1.0.0
# With these repository secrets the APK is signed with your own key (see README, "Making a signed release"):
#   RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD
# Without them it is signed with the same debug key as the CI builds, so it still installs over them.

on:
  push:
    tags:
      - 'v*'
    # Changing release-version.txt on any branch also publishes a release of that version.
    branches:
      - '**'
    paths:
      - 'release-version.txt'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number, like 1.0.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Work out the version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then V="${{ github.event.inputs.version }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then V="${GITHUB_REF_NAME#v}"
          else V="$(tr -d ' \n\r' < release-version.txt)"; fi
          V="${V#v}"
          echo "VERSION=$V" >> "$GITHUB_ENV"

      - name: Write the release notes
        run: |
          PREV=$(git describe --tags --abbrev=0 --match 'v*' HEAD 2>/dev/null || true)
          # If HEAD itself is the tagged commit, look at the tag before it.
          if [ -n "$PREV" ] && [ "$(git rev-list -n 1 "$PREV")" = "$(git rev-parse HEAD)" ]; then
            PREV=$(git describe --tags --abbrev=0 --match 'v*' "$PREV^" 2>/dev/null || true)
          fi
          if [ -n "$PREV" ]; then RANGE="$PREV..HEAD"; else RANGE="-30"; fi
          {
            echo "## What's new in $VERSION"
            echo
            git log $RANGE --no-merges --pretty=format:'- %s' | grep -v -e '^- Publish a release' -e '^- Merge ' || true
            echo
          } > RELEASE_NOTES.md
          # A hand-written release-notes/<version>.md, if there is one, replaces the list of commit titles.
          if [ -f "release-notes/$VERSION.md" ]; then cp "release-notes/$VERSION.md" RELEASE_NOTES.md; fi
          cat RELEASE_NOTES.md

      - name: Restore the signing key (if you added one)
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No release key in the repository secrets; signing with the debug key." 
          else
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Stamp the build with its commit (shown in Settings > About)
        run: echo "$GITHUB_SHA" > app/src/main/assets/build_id.txt

      - name: Build the release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle assembleRelease -PappVersionName="$VERSION" -PappVersionCode="${{ github.run_number }}" --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk "SakuriKey-v${VERSION}.apk"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: SakuriKey-*.apk
          body_path: RELEASE_NOTES.md
